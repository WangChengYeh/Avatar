<figcaption><strong>圖 4</strong>　「打幾折」的規則有多尖銳，決定結果像哪一邊。橫軸是表面的朝向，從正對照片 A 慢慢轉到正對照片 B；縱軸是 A 說的話佔多少。平緩的規則（橘線）一路都是兩張混著用，照片對不上時到處是重影。尖銳的規則（藍線，現在用的）大部分地方只聽一張，只在中間窄窄一段換手。我們選尖銳的：寧可有接縫，不要重影。（兩條線是照式子算的，式子在文末的補充）</figcaption>
