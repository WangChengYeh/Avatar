<text x="190" y="28" text-anchor="middle" class="dg-c-ref">各自畫的兩張</text><rect class="dg-box-ref" x="60" y="44" width="110" height="70" rx="6"/><text x="115" y="84" text-anchor="middle">照片 A</text><rect class="dg-box-ref" x="210" y="44" width="110" height="70" rx="6"/><text x="265" y="84" text-anchor="middle">照片 B</text><line class="dg-ray" x1="172" y1="79" x2="206" y2="79"/><text x="190" y="140" text-anchor="middle" class="dg-s">畫錯時兩張對不上：</text><text x="190" y="158" text-anchor="middle" class="dg-c-fix">檢查抓得到</text><text x="580" y="28" text-anchor="middle" class="dg-c-ai">一張是另一張算出來的</text><rect class="dg-box-ref" x="450" y="44" width="110" height="70" rx="6"/><text x="505" y="84" text-anchor="middle">照片 A</text><rect class="dg-box-ai" x="600" y="44" width="110" height="70" rx="6"/><text x="655" y="78" text-anchor="middle" class="dg-s">由 A</text><text x="655" y="96" text-anchor="middle" class="dg-s">算出來的 B</text><line class="dg-ray2" x1="562" y1="79" x2="596" y2="79" marker-end="url(#dg10e)"/><text x="580" y="140" text-anchor="middle" class="dg-s">A 錯，B 跟著錯，兩張永遠對得上：</text><text x="580" y="158" text-anchor="middle" class="dg-c-ai">檢查通過，等於自己驗證自己</text>

<figcaption><strong>圖 5</strong>　第二顆雷的原因。檢查的原理是比對：兩張各自畫的照片，如果都對，就能由同一個人解釋；有一張畫錯，兩張就對不上。由別張算出來的照片不是「另一次觀察」，它一定和來源對得上。照片的張數變多了，資訊沒有變多，檢查卻變鬆了。</figcaption>
