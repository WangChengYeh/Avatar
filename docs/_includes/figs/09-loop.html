<figcaption><strong>圖 2</strong>　迴圈。執行的 AI 每做完一步就執行同一個指令，問「下一步做什麼」。程式看這一輪的結果，只回一個答案，並附上可以直接照做的指令。迴圈能不能自己轉下去，全看這個程式有沒有漏掉情況：漏掉一種，就停在那裡。</figcaption>
