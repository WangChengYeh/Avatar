<figcaption><strong>圖 10</strong>　第五顆雷之二：修圓邊把腳尖削掉（側面看的腳）。雕出來的外殼有很多稜角，所以有一步「修圓邊」：拿一顆直徑 28 mm 的球在形狀裡面滾，球到不了的地方就去掉。它原本是為了去掉毛邊，但腳尖只有約 2 cm 厚，比球還薄，整段都被當成毛邊削掉（橘色）。v010 的腳長因此從 21.6 cm 變成 12.8 cm。</figcaption>
