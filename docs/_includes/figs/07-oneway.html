<figure class="viz-root diagram">
<svg viewBox="0 0 600 250" role="img" aria-label="好的成品是一個小圈，通過全部檢查的成品是外面的大框；兩者之間的空隙裡，是全部通過卻是壞的成品">
<rect class="dg-frame" x="30" y="24" width="540" height="190" rx="14"/><text x="300" y="48" text-anchor="middle">通過全部檢查的成品</text><rect class="dg-new" x="96" y="62" width="330" height="136" rx="12"/><ellipse class="dg-ball" cx="232" cy="130" rx="104" ry="52"/><text x="232" y="126" text-anchor="middle" class="dg-c-ref">好的成品</text><text x="232" y="146" text-anchor="middle" class="dg-s">一定通過每一項</text><circle class="dg-dot-ai" cx="490" cy="150" r="7"/><text x="490" y="126" text-anchor="middle" class="dg-c-ai">全部通過，</text><text x="490" y="178" text-anchor="middle" class="dg-c-ai">卻是壞的</text><text x="300" y="238" text-anchor="middle" class="dg-s">每補一項檢查，外框往內縮一點（綠色虛線）；縮不到的地方，就是還沒有人量的</text>
</svg>
<figcaption><strong>圖 2</strong>　檢查是單行道。每一項檢查都保證「好的成品一定通過」，卻不保證「通過的就是好的」。大框和小圈之間的空隙，就是那些沒有任何一項檢查在量的性質；紅點是掉在空隙裡的成品。補一項檢查，大框往內縮一點，空隙變小，但不會自己消失。</figcaption>
</figure>
