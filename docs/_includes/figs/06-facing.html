<figcaption><strong>圖 2</strong>　為什麼「正對」的照片比較可信。粗黑線是模型的表面，兩條細線之間是照片上的一個像素。正對著拍（左），一個像素只蓋住一小塊表面，顏色放得準。斜著拍（右），同一個像素被拉成一長條；相機的位置只要差一點，顏色就落到隔壁去。所以每張照片說的話要打折：越斜，折得越多。（示意圖）</figcaption>
