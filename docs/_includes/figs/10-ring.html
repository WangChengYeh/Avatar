<figcaption><strong>圖 7</strong>　為什麼水平要 8 張（從頭頂往下看）。相機越少，離每一台都最斜的那塊表面（紅點）就越斜、越糊。8 張時最差也有正對的 92%；4 張剩 71%；只有正面、一個側面、背面，另一個側面完全沒有照片。朝上的面（肩膀上方、頭頂）和朝下的面（下巴下方）是同樣的道理，所以還要俯角、仰角、俯視的照片。</figcaption>
