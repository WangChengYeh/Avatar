<figcaption><strong>圖 3</strong>　照片不一致時只有兩種結果。左：藍色那張和橘色那張把同一隻眼睛畫在錯開的位置。中：兩張各聽一半，眼睛出現兩次，這叫重影。右：每個地方只聽一張，眼睛只有一隻；但表面上總有一條線，線的兩邊聽的是不同的照片，兩張的膚色只要有一點不同，這條線就看得見，這叫接縫。（示意圖）</figcaption>
