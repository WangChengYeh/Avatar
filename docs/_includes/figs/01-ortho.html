<figcaption><strong>圖 2</strong>　為什麼規格要「正交投影」。兩根一樣長的棒子，一近一遠。左邊是一般相機：視線從一點散開，近的那根在照片上比較長（藍），遠的比較短（橘）。右邊是正交：視線互相平行，兩根在照片上一樣長。人物伸向鏡頭的手不會被放大，各張照片才能直接互相比較。</figcaption>
