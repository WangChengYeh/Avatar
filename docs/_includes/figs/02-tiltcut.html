<figcaption><strong>圖 6</strong>　第三顆雷的道理：真的從斜上方畫出來的照片，一定會切掉一些東西。水平的相機看不到身體的上面和下面，所以只用水平照片雕出來的外殼是「方的」（虛線），比圓的身體多出四個角。從斜上方看，視線（藍線）貼著身體，一定會把其中兩個角切掉（橘色）。完美照片每張至少切掉外殼的 2.2%。一張「什麼都沒切」的斜角照，不可能是獨立畫的。</figcaption>
