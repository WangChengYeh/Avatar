<figcaption><strong>圖 7</strong>　第五顆雷的新做法：兩個指紋。指紋是把一批檔案的內容濃縮成一小串字，內容一變它就變。「會產生結果的程式」變了，舊的結果才需要重跑；只改文件、或只改決定下一步的程式，數字不會變，不用重跑。另一個指紋包含全部檔案，用來回答另一個問題：維護的 AI 是不是已經動過了。</figcaption>
